spring.application.name=Exclusive-Club-Registration-Portal

# Use Railway MySQL environment variables (fallback to localhost for local dev)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ClubRegistration}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional Cache/Redis - disable or use environment variables if Redis service is added on Railway
spring.cache.type=none
# If you are using Redis on Railway, map these:
# spring.data.redis.host=${REDISHOST:localhost}
# spring.data.redis.port=${REDISPORT:6379}
# spring.data.redis.password=${REDISPASSWORD:}

# Allow your Vercel frontend domain in CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://exclusive-club-registration-portal.vercel.app,http://localhost:5173}

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# SMTP Authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=${PORT:8080}
